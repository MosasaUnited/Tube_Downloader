<!-- Tube Downloader app icon: "The Drop Tube" (Stitch brand board, hero concept). Rendered by tool/render_icons.sh. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
                <!-- Deep night background -->
                <linearGradient id="hero_bg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#0B0D14"/>
                  <stop offset="45%" stop-color="#141824"/>
                  <stop offset="100%" stop-color="#2A2550"/>
                </linearGradient>

                <!-- Flow Stream & Play Triangle Gradient -->
                <linearGradient id="hero_core_grad" x1="50%" y1="0%" x2="50%" y2="100%">
                  <stop offset="0%" stop-color="#6C5CE7"/>
                  <stop offset="70%" stop-color="#00C2FF"/>
                  <stop offset="100%" stop-color="#75D1FF"/>
                </linearGradient>

                <!-- Glass Capsule Gradient (Translucent Frosted) -->
                <linearGradient id="hero_glass_grad" x1="20%" y1="0%" x2="80%" y2="100%">
                  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
                  <stop offset="40%" stop-color="#6C5CE7" stop-opacity="0.12"/>
                  <stop offset="100%" stop-color="#00C2FF" stop-opacity="0.18"/>
                </linearGradient>

                <!-- Capsule Rim Stroke Gradient -->
                <linearGradient id="hero_glass_stroke" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#F2F4F8" stop-opacity="0.6"/>
                  <stop offset="40%" stop-color="#262C3D" stop-opacity="0.3"/>
                  <stop offset="100%" stop-color="#00C2FF" stop-opacity="0.8"/>
                </linearGradient>

                <!-- Outer glow filter for triangle & stream -->
                <filter id="glow_stream" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur stdDeviation="32" result="blur"/>
                  <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                </filter>
                <filter id="glow_bar" x="-40%" y="-40%" width="180%" height="180%">
                  <feGaussianBlur stdDeviation="20" result="blur2"/>
                  <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
                </filter>
              </defs>
<!-- LAYER 1: Deep night canvas background -->
              <rect width="1024" height="1024" fill="url(#hero_bg)"/>

              <!-- Ambient backdrop mesh circles -->
              <circle cx="512" cy="512" r="340" fill="#6C5CE7" fill-opacity="0.15" filter="url(#glow_stream)"/>
              <circle cx="512" cy="740" r="220" fill="#00C2FF" fill-opacity="0.12" filter="url(#glow_bar)"/>

              <!-- Subtle grid lines for precision utility aesthetic -->
              <g stroke="#262C3D" stroke-opacity="0.35" stroke-dasharray="8 8">
                <circle cx="512" cy="512" r="410"/>
                <line x1="100" y1="512" x2="924" y2="512"/>
                <line x1="512" y1="100" x2="512" y2="924"/>
              </g>

              
</svg>
